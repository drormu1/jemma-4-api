<div id="chat-widget-container">
    <button id="chat-launcher-btn">
        <svg class="chat-icon-btn chat-icon-ai" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3.2l1.8 4 4 1.8-4 1.8-1.8 4-1.8-4-4-1.8 4-1.8 1.8-4z" fill="currentColor"></path>
            <path d="M18.6 14.4l.7 1.5 1.5.7-1.5.7-.7 1.5-.7-1.5-1.5-.7 1.5-.7.7-1.5z" fill="currentColor"></path>
        </svg>
        העוזר החכם של נבו
    </button>

    <div id="chat-window">
        <div class="chat-header">
            <div class="chat-header-title-wrap">
                <span class="chat-header-ai-icon" aria-hidden="true">✦</span>
                <span class="chat-header-title">העוזר החכם של נבו</span>
            </div>
            <button type="button" id="chat-close-btn" aria-label="סגור">✕</button>
        </div>

        <div id="chat-quick-questions">
            <div class="quick-title">שאלות מובנות מבוססות מסך:</div>
        </div>

        <div class="chat-body" id="chat-discussion">
            <div class="chat-message bot">שלום! לחץ על אחת השאלות המובנות למעלה או הקלד שאלה חופשית בתחתית כדי לקבל מידע חי מהמסך.</div>
        </div>

        <div class="chat-footer">
            <div class="chat-input-row">
                <input type="text" id="chat-user-input" placeholder="או הקלד שאלה חופשית כאן..." />
                <button type="button" id="chat-send-btn">
                    <svg class="send-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>

        <div id="chat-clear-confirm-overlay" class="chat-clear-confirm-overlay" aria-hidden="true">
            <div class="chat-clear-confirm-box" role="dialog" aria-modal="true" aria-labelledby="chat-clear-confirm-title">
                <div id="chat-clear-confirm-title" class="chat-clear-confirm-title">למחוק את כל היסטוריית השיחה?</div>
                <div class="chat-clear-confirm-actions">
                    <button type="button" id="chat-clear-confirm-ok" class="chat-clear-confirm-ok">מחק</button>
                    <button type="button" id="chat-clear-confirm-cancel" class="chat-clear-confirm-cancel">ביטול</button>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-editor-modal" class="chat-editor-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="chat-editor-title" tabindex="-1">
        <div class="chat-editor-dialog" role="document">
            <div class="chat-editor-header">
                <h2 id="chat-editor-title">עריכת תשובת AI</h2>
                <button type="button" id="chat-editor-close-x" class="chat-editor-close-x" aria-label="סגור">✕</button>
            </div>
            <div class="chat-editor-body">
                <textarea id="chat-editor-textarea" class="chat-editor-textarea" placeholder="כאן ניתן לערוך את הטקסט..."></textarea>
            </div>
            <div class="chat-editor-footer">
                <div class="chat-editor-actions-right">
                    <button type="button" id="chat-editor-copy-btn" class="chat-editor-copy-btn">העתק</button>
                    <button type="button" id="chat-editor-copy-close-btn" class="chat-editor-copy-close-btn">העתק וסגור</button>
                </div>
                <button type="button" id="chat-editor-close-btn" class="chat-editor-close-btn">סגור</button>
            </div>
        </div>
    </div>
</div>
