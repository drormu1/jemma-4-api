<div id="chat-widget-container">
    <button id="chat-launcher-btn">
        <svg class="chat-icon-btn" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-10 10 10.1 10.1 0 0 0 1.29 4.9L2 22l5.24-1.29A10 10 0 0 0 22 12a10 10 0 0 0-10-10zm-1.85 14a.7.7 0 0 1-.5.2.73.73 0 0 1-.5-.2L5 11.85a.73.73 0 0 1 0-1L6.15 9.7a.73.73 0 0 1 1 0L10 12.6l4.85-4.85a.73.73 0 0 1 1 0l1.1 1.1a.73.73 0 0 1 0 1z"></path></svg>
        שאל את ה-AI על הלקוח
    </button>

    <div id="chat-window">
        <div class="chat-header">
            <span class="chat-header-title">סוכן חכם - נבו</span>
            <button type="button" id="chat-close-btn" aria-label="סגור">✕</button>
        </div>

        <div id="chat-quick-questions">
            <div class="quick-title">שאלות מובנות מבוססות מסך:</div>
        </div>

        <div class="chat-body" id="chat-discussion">
            <div class="chat-message bot">שלום! לחץ על אחת השאלות המובנות למעלה או הקלד שאלה חופשית בתחתית כדי לקבל מידע חי מהמסך.</div>
        </div>

        <div class="chat-footer">
            <div class="chat-input-row">
                <input type="text" id="chat-user-input" placeholder="או הקלד שאלה חופשית כאן..." />
                <button type="button" id="chat-send-btn">
                    <svg class="send-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>
</div>
